name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Create properly named ZIP
        run: |
          mkdir -p temp/VonSourceTools
          
          rsync -av --exclude='.git' --exclude='__pycache__' \
                    --exclude='*.pyc' --exclude='.github' \
                    ./ temp/VonSourceTools/
          
          cd temp
          zip -r ../VonSourceTools.zip VonSourceTools
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: VonSourceTools.zip
